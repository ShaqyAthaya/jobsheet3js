<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobsheet 3 JS</title>
    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-4">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1>📋 Jobsheet 3 JavaScript</h1>
            <p class="subtitle">01 September 2026 &mdash; Latihan Kondisional &amp; Switch</p>
        </div>

        <!-- Baris 1: Umur, Bilangan, Nilai -->
        <div class="row g-3 mb-3">

            <!-- Card 1: Cek Umur -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h2><span class="icon">🎂</span> Cek Umur</h2>
                        <button class="btn" onclick="cekUmur()">Cek Umur</button>
                        <div class="result-box" id="hasil-umur"></div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Cek Bilangan -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h2><span class="icon">🔢</span> Cek Bilangan</h2>
                        <button class="btn" onclick="cekBilangan()">Cek Bilangan</button>
                        <div class="result-box" id="hasil-bilangan"></div>
                    </div>
                </div>
            </div>

            <!-- Card 3: Cek Nilai -->
            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h2><span class="icon">📊</span> Cek Grade Nilai</h2>
                        <button class="btn" onclick="cekNilai()">Cek Nilai</button>
                        <div class="result-box" id="hasil-nilai"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Baris 2: Besar Kecil, Menu Data -->
        <div class="row g-3 mb-3">

            <!-- Card 4: Cek Besar Kecil -->
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2><span class="icon">⚖️</span> Cek Besar Kecil</h2>
                        <button class="btn" onclick="cekBesarKecil()">Cek Besar Kecil</button>
                        <div class="result-box" id="hasil-besarkecil"></div>
                    </div>
                </div>
            </div>

            <!-- Card 5: Menu Data (Switch) -->
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2><span class="icon">📁</span> Menu Data (Switch)</h2>
                        <div class="data-menu">
                            <button onclick="pilihanData('1')" id="btn-data-1">1. Data Siswa</button>
                            <button onclick="pilihanData('2')" id="btn-data-2">2. Data Guru</button>
                            <button onclick="pilihanData('3')" id="btn-data-3">3. Data Kelas</button>
                            <button onclick="pilihanData('4')" id="btn-data-4">4. Keluar</button>
                        </div>
                        <div class="result-box" id="hasil-data"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Baris 3: Challenge (full width) -->
        <div class="row g-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h2><span class="icon">🏆</span> Challenge — Penilaian Siswa</h2>
                        <button class="btn" onclick="hitungChallenge()">Mulai Penilaian</button>
                        <div class="result-box" id="hasil-challenge"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            Jobsheet 3 JavaScript &mdash; <span>Shaquille Rizky A</span>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
